<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hardware Simulator Dashboard — A companion web-based simulator for the Smart Home Monitoring & Control System. Visualize and control IoT device states in real-time.">
  <title>Hardware Simulator — Smart Home</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%2393c5fd'><path d='M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354z'/></svg>">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- ── Header ── -->
    <header class="header">
      <div class="header-left">
        <div class="header-icon"><i class="bi bi-house-fill"></i></div>
        <div>
          <h1 class="header-title">Hardware Simulator</h1>
          <p class="header-subtitle">Smart Home Monitoring & Control System</p>
        </div>
      </div>
      <div class="header-right">
        <div class="device-counter" id="device-counter">
          <strong>0</strong> ON / <strong>0</strong> Total
        </div>
        <div class="connection-status disconnected" id="connection-status">
          <span class="connection-dot"></span>
          <span id="connection-text">Connecting…</span>
        </div>
      </div>
    </header>

    <!-- ── Floor Tabs ── -->
    <nav class="floor-tabs-container">
      <div class="floor-tabs-label">Floor Plans</div>
      <div class="floor-tabs" id="floor-tabs">
        <button class="floor-tab floor-tab-all active">
          All Floors
          <span class="tab-badge">0</span>
        </button>
        <!-- Floor tabs rendered dynamically by app.js -->
      </div>
    </nav>

    <!-- ── Main Layout: Device Grid + Activity Log ── -->
    <div class="main-layout">

      <!-- Device Grid -->
      <section class="device-grid-section">
        <div class="section-header">
          <div class="section-title">Simulated Appliances</div>
        </div>
        <div class="device-grid" id="device-grid">
          <!-- Loading state -->
          <div class="loading-state">
            <div class="loading-spinner"></div>
            <div class="loading-text">Connecting to Firebase…</div>
          </div>
        </div>
      </section>

      <!-- Activity Log -->
      <aside class="activity-panel">
        <div class="activity-card">
          <div class="activity-header">
            <div class="activity-title">
              <i class="bi bi-journal-text"></i> Activity Log
              <span class="activity-count" id="activity-count">0</span>
            </div>
            <button class="clear-log-btn" id="clear-log-btn">Clear</button>
          </div>
          <div class="activity-log" id="activity-log">
            <div class="activity-empty">
              <div class="activity-empty-icon"><i class="bi bi-journal-text"></i></div>
              <div>No activity yet</div>
              <div style="font-size:0.75rem; margin-top:4px; color:var(--text-dim);">
                Device state changes will appear here
              </div>
            </div>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <!-- ── Firebase SDK (compat — v10 CDN) ── -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
